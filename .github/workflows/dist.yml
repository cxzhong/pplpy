name: Distributions

on:
  push:
    branches: [ "master", "meson" ]
    tags: [ "*" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev libmpfr-dev libmpc-dev

      - name: Build sdist
        run: |
          pip install build
          python -m build --sdist

      - uses: actions/upload-artifact@v6
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: sdist
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - ubuntu-24.04-arm
    env:
      CIBW_BUILD: "cp312-* cp313-* cp314-*"
      CIBW_SKIP: "*-musllinux*"
      CIBW_BEFORE_BUILD_LINUX: >-
        yum install -y gmp-devel || apt-get install -y libgmp-dev
      CIBW_BEFORE_BUILD_MACOS: >-
        brew install gmp
      CIBW_ENVIRONMENT_MACOS: >-
        CPATH=$(brew --prefix gmp)/include:$CPATH
        LIBRARY_PATH=$(brew --prefix gmp)/lib:$LIBRARY_PATH
      CIBW_BUILD_FRONTEND: build
      CIBW_TEST_COMMAND: >-
        python {project}/tests/runtests.py
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build wheels
        uses: pypa/cibuildwheel@v3
        with:
          output-dir: wheelhouse

      - uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  pypi_publish:
    name: Upload to PyPI
    needs: [sdist, build_wheels]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          verbose: true
